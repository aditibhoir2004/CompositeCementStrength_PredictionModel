[project]
name = "compositecementstrength-predictionmodel"
version = "0.1.0"
description = "This is a Regression Model"
readme = "README.md"
authors = [
    { name = "aditibhoir2004", email = "aditibhoir9804@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "chandan-aiops>=1.5.5",
    "ipykernel>=7.3.0",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
]

[project.scripts]
compositecementstrength-predictionmodel = "compositecementstrength_predictionmodel:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
